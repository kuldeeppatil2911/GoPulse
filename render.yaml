services:
  # The Go Web API
  - type: web
    name: gopulse-api
    env: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: gopulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gopulse-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true

  # The Redis Cache
  - type: redis
    name: gopulse-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # The PostgreSQL Database
  - name: gopulse-db
    databaseName: gopulse
    user: gopulse
    plan: free
